# ================================================================ 4 · PS step 7 · DEM error, ramps, atmosphere
[ps.subtr_tropo]
help = "Remove the atmosphere (APS) from the velocity: linear in height, or the weather model of [atmosphere]; n on flat deltas, where it can absorb subsidence (v-do)"
help_vi = "Trừ khí quyển (APS) khỏi vận tốc: tuyến tính theo độ cao, hoặc mô hình thời tiết của [atmosphere]; đặt n ở vùng đồng bằng phẳng, nơi nó có thể nuốt mất lún (v-do)"
use = "Removes the height-correlated delay (or the weather-model delay) before the velocity is estimated."
use_vi = "Trừ phần trễ tương quan với độ cao (hoặc trễ từ mô hình thời tiết) trước khi ước lượng vận tốc."
risk = "On flat deltas a height fit absorbs subsidence (lower ground subsides more)."
risk_vi = "Ở đồng bằng phẳng phép khớp theo độ cao nuốt mất lún (nền thấp lún nhiều hơn)."
typical = "n on flat deltas (hcm_d18: every APS check said off); y in relief."
typical_vi = "n ở đồng bằng phẳng (hcm_d18: mọi kiểm tra APS đều cho thấy nên tắt); y ở vùng có địa hình."
related = ["atmosphere.method", "sbas.troposphere"]

[ps.scla_deramp]
help = "Orbit ramps: n = keep, y = remove a plane per interferogram, auto = remove the part that changes between dates"
help_vi = "Ramp quỹ đạo: n = giữ, y = trừ một mặt phẳng cho mỗi giao thoa đồ, auto = trừ phần thay đổi giữa các ngày"
use = """Removes planar trends (orbit errors, long-wavelength atmosphere, ionosphere). auto removes the part that \
changes from date to date and keeps a steady trend unless a stable background spans the frame."""
use_vi = """Trừ xu hướng dạng mặt phẳng (sai số quỹ đạo, khí quyển bước sóng dài, tầng điện ly). auto trừ phần thay \
đổi từ ngày này sang ngày khác và giữ xu hướng ổn định, trừ khi có nền ổn định trải khắp khung."""
risk = "y removes real large-scale motion (a subsidence bowl larger than the frame becomes a plane and is removed)."
risk_vi = "y trừ mất chuyển động quy mô lớn thật (một phễu lún rộng hơn khung trở thành mặt phẳng và bị trừ)."
typical = "n (default); y in the COSMO-SkyMed preset; auto under review (D3)."
typical_vi = "n (mặc định); y trong preset COSMO-SkyMed; auto đang được đánh giá (D3)."
related = ["ps.ramp_auto_allow_planar", "aoi.bbox"]

[ps.ramp_auto_allow_planar]
