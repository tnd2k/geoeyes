risk = "Needs a series long enough for a smooth model of every point (>= 8 dates); a point off alone is left alone, and a lasting offset is not a patch."
risk_vi = "Cần chuỗi đủ dài để mỗi điểm có mô hình trơn (≥ 8 ngày); điểm lệch một mình được giữ nguyên, và lệch kéo dài không phải là mảng."
