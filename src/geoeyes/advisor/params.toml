help_vi = "Cho phép auto trừ cả xu hướng mặt phẳng ổn định khi không có vùng ổn định"
use = "Lets scla_deramp = auto remove the steady trend too, when you know there is no large-scale motion."
use_vi = "Cho scla_deramp = auto trừ cả xu hướng ổn định, khi biết chắc không có chuyển động quy mô lớn."
risk = "Same risk as scla_deramp = y."
risk_vi = "Rủi ro như scla_deramp = y."
