# GeoEyes parameter catalogue (site advisor, step V0). One table per form field: "[section.key]".
#
#   help     one line shown under the field in the settings form (the text the form showed before V0)
#   use      what the parameter does, and what you gain by setting it
#   risk     what it costs, or how it goes wrong when set badly
#   typical  values in use, the owner's habits and the projects they come from
#   related  other fields to look at together ("section.key")
# Every text has a Vietnamese twin with the suffix _vi. The web app shows the language of the interface;
# `geoeyes params <word>` prints the entries from the command line. Keep this file the only source of these texts.

# ================================================================ project, AOI
[project.description]
help = "Free text shown in the tree, the overview and the report"
help_vi = "Mô tả tự do, hiện trong cây dự án, trang tổng quan và báo cáo"
use = "A sentence that says what the project is for (area, track, purpose). It is copied into the PDF report."
use_vi = "Một câu nói dự án dùng để làm gì (khu vực, quỹ đạo, mục đích). Câu này được chép vào báo cáo PDF."
risk = "None."
risk_vi = "Không có."
typical = "'HCMC descending 18, PSI vs SARPROZ'"
typical_vi = "'TP.HCM quỹ đạo xuống 18, so PSI với SARPROZ'"
related = []

[project.method]
help = "psi: persistent scatterers; psds: PS + distributed scatterers (phase linking)"
help_vi = "psi: điểm tán xạ bền vững; psds: PS + điểm phân tán (liên kết pha)"
use = """The processing chain. psi keeps stable point targets (buildings, roads, rock); best in cities. psds adds the \
distributed scatterers (fields, bare soil, sparse vegetation) after phase linking, so rural areas and slopes get \
many more points. sbas forms small-baseline interferograms on a multilooked grid and inverts them per pixel; best \
for slow, spatially smooth motion over large non-urban areas. ps_lite is the short-stack workflow of Capella and \
Umbra."""
use_vi = """Chuỗi xử lý. psi giữ các điểm tán xạ bền vững (nhà, đường, đá); tốt nhất ở đô thị. psds thêm các điểm \
phân tán (ruộng, đất trống, thực vật thưa) sau liên kết pha, nên vùng nông thôn và sườn dốc có nhiều điểm hơn hẳn. \
sbas tạo giao thoa đồ baseline ngắn trên lưới multilook và nghịch đảo theo từng pixel; tốt cho chuyển động chậm, \
trơn theo không gian trên vùng rộng ngoài đô thị. ps_lite là quy trình chuỗi ngắn của Capella và Umbra."""
risk = """psds and sbas cost much more time and memory than psi. sbas gives grid cells (about 30 m), not single \
buildings. ps_lite is refused for Sentinel-1."""
risk_vi = """psds và sbas tốn thời gian và bộ nhớ hơn psi nhiều. sbas cho ô lưới (khoảng 30 m), không phải từng toà \
nhà. ps_lite bị từ chối với Sentinel-1."""
typical = "Cities (HCMC, Hanoi, Hai Phong): psi. Slopes, farmland, landslides: psds or sbas. Capella / Umbra: ps_lite."
typical_vi = "Đô thị (TP.HCM, Hà Nội, Hải Phòng): psi. Sườn dốc, đồng ruộng, trượt lở: psds hoặc sbas. Capella / Umbra: ps_lite."
related = ["phase_linking.enabled", "sbas.looks_az", "selection.da_threshold"]

[aoi.bbox]
help = "West, south, east, north (WGS84 degrees)"
help_vi = "Tây, nam, đông, bắc (độ WGS84)"
use = """The area processed. Only the bursts that cover it are downloaded and only its pixels go through the chain. \
Include some stable ground around the target: the reference area, the ramp and the atmosphere estimates need it."""
use_vi = """Vùng được xử lý. Chỉ tải các burst phủ vùng này và chỉ các pixel của nó đi qua chuỗi xử lý. Nên lấy thêm \
một ít nền ổn định quanh mục tiêu: vùng tham chiếu, ước lượng ramp và khí quyển đều cần nền đó."""
risk = """Too small: no stable reference, ramps and atmosphere cannot be told from motion. Too large: hours more \
processing and memory; very large areas need sbas or tiling."""
risk_vi = """Quá nhỏ: không có tham chiếu ổn định, không tách được ramp và khí quyển khỏi chuyển động. Quá lớn: thêm \
hàng giờ xử lý và bộ nhớ; vùng rất rộng cần sbas hoặc chia ô."""
typical = "A city district plus 2-5 km of margin; a landslide slope plus the valley floor."
typical_vi = "Một quận cộng 2-5 km xung quanh; một sườn trượt cộng thêm đáy thung lũng."
related = ["ps.ref_centre_lonlat", "ps.scla_deramp"]

# ================================================================ 1 · acquisition
[acquire.date_range]
help = "Sentinel-1 acquisitions between these dates are downloaded from ASF"
help_vi = "Tải từ ASF các lần chụp Sentinel-1 trong khoảng ngày này"
use = """The time span of the series. A longer span gives a more precise linear velocity (its error falls roughly as \
1 / span^1.5) and separates seasonal motion from the trend."""
use_vi = """Khoảng thời gian của chuỗi. Khoảng càng dài thì vận tốc tuyến tính càng chính xác (sai số giảm khoảng \
1 / khoảng^1,5) và tách được chuyển động mùa khỏi xu hướng."""
risk = """Long spans lose coherence on vegetation and changing land use; Sentinel-1B stopped in December 2021, so \
the revisit is 12 days in most places after that. Fast motion over long gaps can alias."""
risk_vi = """Khoảng dài làm mất độ nhất quán trên thực vật và nơi đất thay đổi; Sentinel-1B ngừng từ 12/2021 nên \
sau đó hầu hết nơi chỉ còn chu kỳ 12 ngày. Chuyển động nhanh qua các khoảng trống dài có thể bị chập."""
typical = "At least 2 years (Hanoi GNSS tie: >= 2 years); hcm_d18 and hp_maychai: about 3-4 years, 98-110 dates."
typical_vi = "Ít nhất 2 năm (đối chiếu GNSS Hà Nội: >= 2 năm); hcm_d18 và hp_maychai: khoảng 3-4 năm, 98-110 ảnh."
related = ["acquire.max_per_month", "ps.unwrap_time_win"]

[acquire.max_per_month]
help = "Keep the first N acquisitions of each month (0 = all)"
help_vi = "Giữ N lần chụp đầu tiên của mỗi tháng (0 = tất cả)"
use = """Thins the series to save download and processing. Two per month keeps the seasonal cycle and halves the \
work of a 6-day series."""
use_vi = """Tỉa bớt chuỗi để đỡ tải và xử lý. Hai ảnh mỗi tháng vẫn giữ được chu kỳ mùa và giảm một nửa khối lượng \
của chuỗi 6 ngày."""
risk = """Longer gaps between dates: fast motion (> about 50 mm/yr in C band) and vegetated areas unwrap worse, and \
events (a landslide, a flood) may fall between dates."""
risk_vi = """Khoảng cách giữa các ảnh dài hơn: chuyển động nhanh (> khoảng 50 mm/năm ở băng C) và vùng có thực vật \
giải chập kém hơn, và sự kiện (trượt lở, lũ) có thể rơi vào giữa hai ảnh."""
typical = "2 (default). 0 for fast subsidence, landslides or short spans."
typical_vi = "2 (mặc định). 0 cho lún nhanh, trượt lở hoặc khoảng thời gian ngắn."
related = ["acquire.date_range"]

[acquire.archive]
help = "Folder of raw scenes shared by projects ('' = workspace archive)"
help_vi = "Thư mục ảnh gốc dùng chung giữa các dự án ('' = kho của workspace)"
use = "Where the downloaded bursts are kept, so several projects on the same track share one download."
use_vi = "Nơi giữ các burst đã tải, để nhiều dự án trên cùng quỹ đạo dùng chung một lần tải."
risk = "A folder on a slow or full disk slows every phase that reads the scenes."
risk_vi = "Thư mục trên ổ chậm hoặc đầy làm chậm mọi pha đọc ảnh."
typical = "'' (the workspace archive)."
typical_vi = "'' (kho của workspace)."
related = []

# ================================================================ 2 · stack
[network.reference]
help = "Reference date of the stack ('auto' = the most central acquisition)"
help_vi = "Ngày ảnh chủ của stack ('auto' = ngày nằm giữa nhất)"
use = """The date every other date is coregistered and differenced against. The central date keeps the temporal \
and perpendicular baselines small on both sides, which keeps the coherence up."""
use_vi = """Ngày mà mọi ngày khác được đồng đăng ký và lấy hiệu so với nó. Ngày nằm giữa giữ cho baseline thời gian \
và vuông góc nhỏ ở cả hai phía, nhờ đó độ nhất quán cao."""
risk = """A reference on a bad date (rain, snow, strong atmosphere) adds its noise to every interferogram. Changing \
it means coregistering the stack again."""
risk_vi = """Ảnh chủ rơi vào ngày xấu (mưa, tuyết, khí quyển mạnh) cộng nhiễu của nó vào mọi giao thoa đồ. Đổi ảnh \
chủ nghĩa là phải đồng đăng ký lại stack."""
typical = "auto. Fixed date when comparing with another product (hcm_d18: 2024-11-06, as SARPROZ)."
typical_vi = "auto. Đặt cố định khi so với sản phẩm khác (hcm_d18: 2024-11-06, như SARPROZ)."
related = ["stack.incremental"]

[network.max_perp_m]
help = "Largest perpendicular baseline kept (m)"
help_vi = "Đường cơ sở vuông góc lớn nhất được giữ (m)"
use = """Drops dates whose orbit is too far from the reference. Large baselines decorrelate distributed scatterers \
and make the phase very sensitive to DEM errors."""
use_vi = """Bỏ các ngày có quỹ đạo quá xa ảnh chủ. Baseline lớn làm mất tương quan điểm phân tán và làm pha rất \
nhạy với sai số DEM."""
risk = "Too small drops good dates. Sentinel-1 baselines stay within about +-150 m, so the default keeps almost all."
risk_vi = "Quá nhỏ thì bỏ mất ngày tốt. Baseline Sentinel-1 nằm trong khoảng +-150 m nên mặc định giữ gần như tất cả."
typical = "150 m for Sentinel-1; larger for the X-band sensors, as their presets set it."
typical_vi = "150 m cho Sentinel-1; lớn hơn cho các cảm biến băng X, theo preset của chúng."
related = ["ps.max_topo_err", "network.max_temporal_days"]

[network.max_temporal_days]
help = "Largest temporal baseline kept (days, 0 = no limit)"
help_vi = "Đường cơ sở thời gian lớn nhất được giữ (ngày, 0 = không giới hạn)"
use = """Limits the time between the two dates of a pair. For SBAS it sets the network: short pairs keep coherence \
on vegetation and soil."""
use_vi = """Giới hạn thời gian giữa hai ngày của một cặp. Với SBAS nó quyết định mạng: cặp ngắn giữ được độ nhất \
quán trên thực vật và đất."""
risk = """Too short a limit gives a thin, poorly connected SBAS network and lets small unwrapping biases accumulate \
over time."""
risk_vi = """Giới hạn quá ngắn cho mạng SBAS thưa, kém liên thông, và để các sai lệch nhỏ khi giải chập cộng dồn \
theo thời gian."""
typical = "0 for PSI. SBAS: 0 with sbas.n_nearest = 3, or 36-96 days on vegetation."
typical_vi = "0 cho PSI. SBAS: 0 với sbas.n_nearest = 3, hoặc 36-96 ngày trên vùng thực vật."
related = ["sbas.n_nearest"]

[stack.dem]
help = "srtm-1 or copernicus-30 (downloaded when missing), a folder of .hgt or a GeoTIFF"
help_vi = "srtm-1 hoặc copernicus-30 (tự tải khi chưa có), một thư mục .hgt hoặc một GeoTIFF"
use = """The terrain model removed from the phase and used to geocode. Copernicus 30 is newer (2011-2015) and \
better in steep terrain; SRTM (2000) is the StaMPS habit. A lidar DSM can be given as a GeoTIFF."""
use_vi = """Mô hình địa hình được trừ khỏi pha và dùng để geocode. Copernicus 30 mới hơn (2011-2015) và tốt hơn ở \
địa hình dốc; SRTM (2000) là thói quen của StaMPS. DSM lidar có thể đưa vào dạng GeoTIFF."""
risk = """Both are surface models (roofs, trees). The DEM error of each point is estimated in step 2 anyway, so the \
choice matters most for geocoding and steep slopes."""
risk_vi = """Cả hai đều là mô hình bề mặt (mái nhà, cây). Sai số DEM của từng điểm vẫn được ước lượng ở bước 2, nên \
lựa chọn quan trọng nhất cho geocode và sườn dốc."""
typical = "srtm-1 in flat deltas; copernicus-30 on mountains and landslide slopes."
typical_vi = "srtm-1 ở đồng bằng; copernicus-30 ở vùng núi và sườn trượt lở."
related = ["ps.max_topo_err"]

[stack.esd]
help = "Enhanced spectral diversity (Sentinel-1 azimuth fine coregistration)"
help_vi = "Enhanced spectral diversity (đồng đăng ký tinh theo phương vị của Sentinel-1)"
use = """Aligns the bursts of Sentinel-1 TOPS to about 1/1000 pixel in azimuth. Without it the phase jumps at the \
burst boundaries."""
use_vi = """Căn các burst của Sentinel-1 TOPS đến khoảng 1/1000 pixel theo phương vị. Không có nó pha bị nhảy ở \
ranh giới các burst."""
risk = "Needs coherent ground in the burst overlaps; where they cover only sea or dense forest the estimate is poor."
risk_vi = "Cần nền có độ nhất quán trong vùng chồng burst; nơi vùng chồng chỉ có biển hoặc rừng rậm thì ước lượng kém."
typical = "true for Sentinel-1 (always)."
typical_vi = "true cho Sentinel-1 (luôn bật)."
related = []

[stack.multilook]
help = "Range, azimuth looks (1, 1 = full resolution)"
help_vi = "Số look theo cự ly, phương vị (1, 1 = độ phân giải đầy đủ)"
use = """Averages neighbouring pixels of the stack. Fewer pixels and less noise, at the cost of resolution. PSI \
works at full resolution."""
use_vi = """Lấy trung bình các pixel lân cận của stack. Ít pixel hơn và ít nhiễu hơn, đổi lại mất độ phân giải. PSI \
làm việc ở độ phân giải đầy đủ."""
risk = "Multilooking mixes a point target with its surroundings and removes the PS character."
risk_vi = "Multilook trộn điểm tán xạ với xung quanh và làm mất tính chất PS."
typical = "1, 1. SBAS sets its own looks in [sbas]."
typical_vi = "1, 1. SBAS đặt số look riêng trong [sbas]."
related = ["sbas.looks_az", "sbas.looks_rg"]

[stack.incremental]
help = "Keep coregistered dates when the stack is extended (same reference)"
help_vi = "Giữ các ngày đã đồng đăng ký khi mở rộng stack (cùng ảnh chủ)"
use = "When new dates arrive only those are coregistered; the old ones are kept. Monitoring becomes cheap."
use_vi = "Khi có ngày mới chỉ đồng đăng ký các ngày đó; giữ nguyên các ngày cũ. Giám sát trở nên rẻ."
risk = "Only valid with the same reference; a new reference rebuilds everything."
risk_vi = "Chỉ đúng khi giữ nguyên ảnh chủ; đổi ảnh chủ thì làm lại toàn bộ."
typical = "true."
typical_vi = "true."
related = ["network.reference"]

# ================================================================ 3 · phase linking
[phase_linking.enabled]
help = "Phase linking of distributed scatterers before the point engine"
help_vi = "Liên kết pha các điểm phân tán trước bộ xử lý điểm"
use = """Estimates one consistent phase series for each distributed scatterer from all interferogram pairs of its \
statistically homogeneous neighbours. Gives many reliable points on fields, soil, slopes and sparse vegetation."""
use_vi = """Ước lượng một chuỗi pha nhất quán cho mỗi điểm phân tán từ mọi cặp giao thoa của các pixel lân cận đồng \
nhất thống kê. Cho nhiều điểm tin cậy trên ruộng, đất, sườn dốc và thực vật thưa."""
risk = "Slow (the SHP search and the covariance per pixel); smooths sharp spatial changes within the window."
risk_vi = "Chậm (tìm SHP và ma trận hiệp phương sai cho từng pixel); làm trơn các thay đổi không gian sắc nét trong cửa sổ."
typical = "On for psds and for landslide slopes; off for dense cities with psi."
typical_vi = "Bật cho psds và sườn trượt lở; tắt cho đô thị dày đặc với psi."
related = ["project.method", "phase_linking.estimator", "phase_linking.shp_test"]

[phase_linking.estimator]
help = "Phase linking estimator"
help_vi = "Bộ ước lượng liên kết pha"
use = """How the series is taken from the coherence matrix. adaptive chooses between the eigen decomposition and the \
maximum-likelihood fit by the quality of the matrix, so a poorly estimated matrix does not break the fit."""
use_vi = """Cách lấy chuỗi pha từ ma trận độ nhất quán. adaptive chọn giữa phân tích trị riêng và phép khớp hợp lý \
cực đại theo chất lượng của ma trận, nên ma trận ước lượng kém không làm hỏng phép khớp."""
risk = "A pure maximum-likelihood estimator is unstable when the coherence matrix is near singular (few SHP)."
risk_vi = "Bộ ước lượng hợp lý cực đại thuần tuý không ổn định khi ma trận gần suy biến (ít SHP)."
typical = "adaptive (owner's default)."
typical_vi = "adaptive (mặc định của chủ dự án)."
related = ["phase_linking.min_shp"]

[phase_linking.shp_test]
help = "Statistically homogeneous pixels: ad = Anderson-Darling, ks = Kolmogorov-Smirnov"
help_vi = "Pixel đồng nhất thống kê (SHP): ad = Anderson-Darling, ks = Kolmogorov-Smirnov"
use = """The test that decides which neighbours share the amplitude statistics of a pixel. Anderson-Darling weighs \
the tails and separates mixed land covers better than Kolmogorov-Smirnov."""
use_vi = """Phép thử quyết định pixel lân cận nào có cùng thống kê biên độ với một pixel. Anderson-Darling chú ý \
phần đuôi và tách lớp phủ hỗn hợp tốt hơn Kolmogorov-Smirnov."""
risk = "Needs enough dates (about 20 or more) for the test to have power."
risk_vi = "Cần đủ số ngày (khoảng 20 trở lên) để phép thử có sức phân biệt."
typical = "ad (owner's default)."
typical_vi = "ad (mặc định của chủ dự án)."
related = ["phase_linking.shp_alpha", "phase_linking.half_window"]

[phase_linking.half_window]
help = "Half window of the SHP search (rows, columns)"
help_vi = "Nửa cửa sổ tìm SHP (hàng, cột)"
use = "The neighbourhood searched for homogeneous pixels. A larger window finds more SHP and lowers the noise."
use_vi = "Vùng lân cận được tìm pixel đồng nhất. Cửa sổ lớn tìm được nhiều SHP hơn và giảm nhiễu."
risk = "The time grows with the window area; a large window blurs small landslides and building edges."
risk_vi = "Thời gian tăng theo diện tích cửa sổ; cửa sổ lớn làm mờ khối trượt nhỏ và mép công trình."
typical = "7, 7 (15 x 15 pixels, about 210 m x 35 m in Sentinel-1)."
typical_vi = "7, 7 (15 x 15 pixel, khoảng 210 m x 35 m với Sentinel-1)."
related = ["phase_linking.min_shp"]

[phase_linking.shp_alpha]
help = "Significance level of the SHP test"
help_vi = "Mức ý nghĩa của phép thử SHP"
use = "Lower values accept more neighbours as homogeneous; higher values are stricter."
use_vi = "Giá trị thấp nhận nhiều pixel lân cận là đồng nhất hơn; giá trị cao khắt khe hơn."
risk = "Too low mixes different surfaces; too high leaves too few SHP."
risk_vi = "Quá thấp trộn các bề mặt khác nhau; quá cao để lại quá ít SHP."
typical = "0.05."
typical_vi = "0.05."
related = ["phase_linking.shp_test"]

[phase_linking.min_shp]
help = "Minimum number of SHP for a distributed scatterer"
help_vi = "Số SHP tối thiểu cho một điểm phân tán"
use = "A pixel with fewer homogeneous neighbours is not linked: its coherence matrix would be too noisy."
use_vi = "Pixel có ít pixel đồng nhất hơn ngưỡng này thì không liên kết: ma trận độ nhất quán sẽ quá nhiễu."
risk = "Too high removes narrow targets (roads, dykes, small slopes)."
risk_vi = "Quá cao bỏ mất các đối tượng hẹp (đường, đê, sườn nhỏ)."
typical = "25."
typical_vi = "25."
related = ["phase_linking.half_window"]

[phase_linking.ps_da_max]
help = "PS below this amplitude dispersion keep their own SLC (0 = link all)"
help_vi = "PS có DA dưới ngưỡng này giữ SLC gốc của mình (0 = liên kết tất cả)"
use = "True point targets keep their own unfiltered phase, so linking does not smear them with their surroundings."
use_vi = "Điểm tán xạ thật giữ pha gốc chưa lọc của mình, nên liên kết pha không làm nhoè chúng với xung quanh."
risk = "0 links everything, which blurs buildings in cities."
risk_vi = "0 liên kết tất cả, làm mờ các công trình ở đô thị."
typical = "0.25."
typical_vi = "0.25."
related = ["selection.da_threshold"]

[phase_linking.gaussian_sigma]
help = "Gaussian post-filter of the linked phase (0 = off)"
help_vi = "Lọc Gauss sau liên kết pha (0 = tắt)"
use = "Smooths the linked phase in space; the CSK chain uses it after phase linking."
